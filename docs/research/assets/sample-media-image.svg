<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DocuLight sample media image</title>
  <desc id="desc">A generated SVG fixture for testing the DocuLight image viewer.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect x="40" y="40" width="1120" height="680" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
  <rect x="88" y="96" width="420" height="210" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <rect x="604" y="96" width="508" height="210" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <rect x="88" y="398" width="1024" height="226" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="120" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#075985">Mermaid + Image</text>
  <text x="120" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0f172a">Local SVG image fixture</text>
  <text x="636" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#166534">Zoom / Pan / Download</text>
  <text x="636" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#0f172a">Use the media viewer controls</text>
  <text x="120" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#92400e">Korean text rendering check</text>
  <text x="120" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#0f172a">긴 한국어 문장과 mixed English text가 이미지 확대 창에서 잘 보이는지 확인합니다.</text>
  <path d="M508 201 C554 201 558 201 604 201" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
