name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── 버전/태그 결정, workflow_dispatch 시 태그 자동 생성 ─────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version and tag from package.json
        id: info
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
              echo "Trigger tag $GITHUB_REF_NAME does not match package version $EXPECTED_TAG" >&2
              exit 1
            fi
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$EXPECTED_TAG"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG"         >> $GITHUB_OUTPUT

  # ── Windows 빌드 (NSIS 설치 파일 + Portable) ────────────────────────────
  build-windows:
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}

      - name: Install Electron test runtime
        run: npm rebuild electron

      - name: Build Windows
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_python: ${{ steps.python.outputs.python-path }}

      - name: Release regression tests
        run: npm run test:release-regression

      - name: Package smoke
        run: npm run smoke:package
        env:
          DOCULIGHT_PACKAGE_SMOKE_REPORT_DIR: package-smoke-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/DocuLight-Setup-*.exe
            dist/DocuLight-Portable-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package-smoke
          path: package-smoke-artifacts/*.json
          if-no-files-found: error

  # ── macOS 빌드 (Portable zip — Intel x64 + Apple Silicon arm64) ──────────
  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}

      - name: Install Electron test runtime
        run: npm rebuild electron

      - name: Build macOS
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          npm_config_python: ${{ steps.python.outputs.python-path }}

      - name: Release regression tests
        run: npm run test:release-regression

      - name: Package smoke
        run: npm run smoke:package
        env:
          DOCULIGHT_PACKAGE_SMOKE_REPORT_DIR: package-smoke-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/DocuLight-*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package-smoke
          path: package-smoke-artifacts/*.json
          if-no-files-found: error

  # ── Linux 빌드 (AppImage + .deb — Ubuntu/Debian) ────────────────────────
  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          npm_config_python: ${{ steps.python.outputs.python-path }}

      - name: Install Electron test runtime
        run: npm rebuild electron

      - name: Build Linux
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_python: ${{ steps.python.outputs.python-path }}

      - name: Release regression tests
        run: npm run test:release-regression

      - name: Package smoke
        run: xvfb-run --auto-servernum npm run smoke:package
        env:
          DOCULIGHT_PACKAGE_SMOKE_REPORT_DIR: package-smoke-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/DocuLight-*.AppImage
            dist/DocuLight-*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-smoke
          path: package-smoke-artifacts/*.json
          if-no-files-found: error

  # ── GitHub Release 생성 및 아티팩트 업로드 ──────────────────────────────
  release:
    needs: [prepare, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/release-note
          fetch-depth: 0

      - name: Verify or create release tag
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Release tag $TAG points to $TAG_SHA, expected $GITHUB_SHA" >&2
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          else
            echo "Release tag $TAG does not exist for push event" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Check for release notes
        id: release-notes
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          NOTE_FILE="docs/release-note/${TAG}.md"
          if [ -f "$NOTE_FILE" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$NOTE_FILE" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - uses: softprops/action-gh-release@v2
        if: steps.release-notes.outputs.found == 'true'
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "DocuLight Viewer ${{ needs.prepare.outputs.version }}"
          body_path: ${{ steps.release-notes.outputs.path }}
          files: |
            artifacts/windows-artifacts/*.exe
            artifacts/macos-artifacts/*.zip
            artifacts/linux-artifacts/*.AppImage
            artifacts/linux-artifacts/*.deb

      - uses: softprops/action-gh-release@v2
        if: steps.release-notes.outputs.found != 'true'
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "DocuLight Viewer ${{ needs.prepare.outputs.version }}"
          generate_release_notes: true
          files: |
            artifacts/windows-artifacts/*.exe
            artifacts/macos-artifacts/*.zip
            artifacts/linux-artifacts/*.AppImage
            artifacts/linux-artifacts/*.deb
