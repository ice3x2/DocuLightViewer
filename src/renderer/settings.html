<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>DocuLight Settings</title>
  <link rel="stylesheet" href="./settings.css">
</head>
<body>
  <div id="settings-container">
    <h1 data-i18n="settings.heading">Settings</h1>

    <form id="settings-form">
      <div class="form-group">
        <label for="theme-select" data-i18n="settings.theme">Theme</label>
        <select id="theme-select">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fontSize-input" data-i18n="settings.fontSize">Font Size (px)</label>
        <input type="number" id="fontSize-input" min="8" max="32" value="16">
      </div>

      <div class="form-group">
        <label for="fontFamily-input" data-i18n="settings.fontFamily">Font Family</label>
        <input type="text" id="fontFamily-input" value="system-ui, -apple-system, sans-serif">
      </div>

      <div class="form-group">
        <label for="contentWidth-input" data-i18n="settings.contentWidth">Content Width</label>
        <input type="text" id="contentWidth-input" value="900px">
        <small class="hint" data-i18n="settings.contentWidthHint">e.g. 800px, 90% (empty = auto)</small>
      </div>

      <div class="form-group">
        <label for="contentMaxWidth-input" data-i18n="settings.contentMaxWidth">Max Content Width</label>
        <input type="text" id="contentMaxWidth-input" value="900px">
        <small class="hint" data-i18n="settings.contentMaxWidthHint">e.g. 900px, 100% (empty = no limit)</small>
      </div>

      <div class="form-group">
        <label for="codeTheme-select" data-i18n="settings.codeTheme">Code Theme</label>
        <select id="codeTheme-select">
          <option value="github">GitHub</option>
          <option value="monokai">Monokai</option>
          <option value="dracula">Dracula</option>
        </select>
      </div>

      <div class="form-group">
        <label for="defaultWindowSize-select" data-i18n="settings.defaultWindowSize">Default Window Size</label>
        <select id="defaultWindowSize-select">
          <option value="auto" data-i18n="settings.windowSizeAuto">Auto (remember last size)</option>
          <option value="s" data-i18n="settings.windowSizeSmall">Small</option>
          <option value="m" data-i18n="settings.windowSizeMedium">Medium</option>
          <option value="l" data-i18n="settings.windowSizeLarge">Large</option>
          <option value="f" data-i18n="settings.windowSizeFull">Full Screen</option>
        </select>
      </div>

      <div class="section-divider"></div>
      <div class="form-group">
        <label class="section-label" data-i18n="settings.fileAssociation">File Association</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="fileAssociation-checkbox">
            <span data-i18n="settings.fileAssocCheckbox">Register as default app for .md files</span>
          </label>
          <small class="hint" id="file-assoc-hint"></small>
          <div id="file-assoc-status" class="status-indicator hidden"></div>
        </div>
        <button type="button" id="open-default-apps-btn" class="link-button hidden" data-i18n="settings.openDefaultApps">
          Open system default apps settings
        </button>
      </div>

      <div class="section-divider"></div>
      <div class="form-group">
        <label class="section-label" data-i18n="settings.autoRefresh">Auto Refresh</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="autoRefresh-checkbox" checked>
            <span data-i18n="settings.autoRefreshHint">Automatically refresh when file changes</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="section-label" data-i18n="settings.enableTabs">Enable Tabs</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="enableTabs-checkbox">
            <span data-i18n="settings.enableTabsHint">Manage multiple documents in tabs within one window</span>
          </label>
        </div>
      </div>

      <div class="section-divider"></div>
      <div class="form-group">
        <label for="mcpPort-input" data-i18n="settings.mcpPort">MCP Server Port</label>
        <input type="number" id="mcpPort-input" min="1" max="65535" value="32580">
        <div class="mcp-port-hint-row">
          <small class="hint" data-i18n="settings.mcpPortHint">Requires app restart after change</small>
          <small id="mcp-port-status" class="hint"></small>
        </div>
        <small id="mcp-address" class="hint mcp-address-link">http://localhost:32580/mcp</small>
      </div>

      <div class="form-group">
        <label class="section-label" data-i18n="settings.mcpAutoSave">Save Documents from MCP</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="mcpAutoSave-checkbox">
            <span data-i18n="settings.mcpAutoSaveCheckbox">Auto-save</span>
          </label>
          <small class="hint" data-i18n="settings.mcpAutoSaveHint">Auto-save files opened via MCP to disk</small>
        </div>
        <div class="path-input-group" id="mcpAutoSavePath-group">
          <input type="text" id="mcpAutoSavePath-input"
                 data-i18n-placeholder="settings.mcpAutoSavePathPlaceholder">
          <button type="button" id="mcpAutoSavePath-browse-btn"
                  data-i18n="settings.mcpAutoSavePathBrowse">Browse</button>
        </div>
        <div class="path-input-group" id="mcpSaveSubDir-group">
          <input type="text" id="mcpSaveSubDir-input"
                 data-i18n-placeholder="settings.mcpSaveSubDirPlaceholder">
          <button type="button" id="mcpSaveSubDir-help-btn" class="help-btn"
                  data-i18n-title="settings.mcpSaveSubDirHelp">?</button>
        </div>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="mcpGitInfo-checkbox">
            <span data-i18n="settings.mcpGitInfo">Git 정보 자동 수집</span>
          </label>
          <small class="hint" data-i18n="settings.mcpGitInfoHint">
            MCP 문서에 프로젝트 경로가 제공되면 git 정보를 프론트매터에 자동 추가
          </small>
        </div>
      </div>

      <div class="button-group">
        <button type="button" id="reset-button" data-i18n="settings.resetButton">Reset to Defaults</button>
        <button type="button" id="save-button" data-i18n="settings.saveButton">Save</button>
      </div>

      <div id="save-message" class="hidden" data-i18n="settings.savedMessage">Settings saved</div>
    </form>
  </div>

  <div id="subdir-help-modal" class="modal-overlay hidden">
    <div class="modal-content modal-small">
      <h3 data-i18n="settings.mcpSaveSubDirHelpTitle">Subdirectory Format Help</h3>
      <pre id="subdir-help-body"></pre>
      <button type="button" class="modal-close-btn" data-i18n="settings.closeButton">Close</button>
    </div>
  </div>

  <div id="mcp-copy-toast" class="mcp-toast"></div>
  <script src="./settings.js"></script>
</body>
</html>
